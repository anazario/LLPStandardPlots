# Data/MC comparison in the SV and prompt photon CRs, compressed baseline,
# full Run 2 + Run 3 data 2016-2026 from the v54 skims, v54 Run 2 + Run 3 MC.
#   -> datamc_sv_promptpho_compressed_v54/<region>/...          nominal plots
#   -> datamc_sv_promptpho_compressed_v54_sf/<region>/...       same plots with the fitted MC SFs
#
# Baseline (src/config.py): MET > 150, rjrPTS[0] < 200, rjrIsr_nSVisObjects > 0, plus the
# kinematic N-1 cuts PtISR > 300 and RISR >= 0.4 (lowest bin edges of the LittleGuy configs):
# the PtISR plot has the RISR cut only, the RISR plot the PtISR cut only, all others both.
#
# Run on cmslpc:  python main.py --input-config config/datamc_sv_promptpho_compressed_v54.yaml --workers 8 --local-eos

base_dir: /eos/uscms/store/group/lpcsusylep/malazaro/KUCMSSkims/skims_v54/

# No `lumi:` -> each MC file is scaled by the luminosity of its own run (src/lumi.py):
# Run 2 MC (RunIISummer20UL18) -> 2016-18, Run 3 MC (Run3Summer23[BPix]) -> 2022-26.
years: all
analysis_type: compressed
plots: [ratio]
format: [pdf, root]
output: datamc_sv_promptpho_compressed_v54

flags:
  # Prompt photon CR:
  #   nBaseLinePhotons >= 1, all baseline photons |WTimeSig| < 2.5 and isoANNScore < 0.96
  - cut: "PROMPT_PHO_CR_COMPRESSED_GE1"
    region_type: pho
    name: PromptPho
  # SV CRs, photon veto keeps them disjoint from the photon CR
  - cut: "(SV_nHadronic >= 1) & (HadronicSV_dxySig < 800) & (HadronicSV_mass > 15) & (nBaseLinePhotons == 0)"
    region_type: sv
    name: HadSV
  - cut: "(SV_nLeptonic >= 1) & (LeptonicSV_dxySig < 500) & (nBaseLinePhotons == 0)"
    region_type: sv
    name: LepSV

# MC scale-factor fit (see README). One data pass writes the nominal plots, the yields,
# the SFs and the replot with the SFs. Iterate on the fit alone (seconds) with:
#   python fit_sfs.py --config config/datamc_sv_promptpho_compressed_v54.yaml
sf_fit:
  # The two SV regions can share events (hadronic + leptonic SV); fitted per region.
  channels: [PromptPho:isr_risr, HadSV:isr_risr, LepSV:isr_risr]
  per_era: ["QCD multijets"]        # "all" for separate Run 2 / Run 3 SFs for every process
  per_region: true                  # the regions have very different selections: fit each on its own
  # fix: {"t#bar{t}+jets": 1.0}     # tt+jets is Run 2 only (no Run 3 sample)
  replot: true

# Ratio plots do not draw signal; it only has to load.
signal:
  - gogoGZ_mGl-2500_mN2-1200_mN1-500_ct0p1__SVHPM100_FullMini_v38__rjrskim.root

background:
  - name: QCD multijets
    files:
      - QCD_HT*_RunIISummer20UL18__SVIPM100_v34__rjrskim.root
      - QCD-4Jets_HT-*_Run3Summer23BPix__SVIPM100_v34__rjrskim.root
  - name: W+jets
    files:
      - WJetsToLNu_HT-*_RunIISummer20UL18__SVIPM100_v34__rjrskim.root
      - WtoLNu-4Jets_MLNu-*_Rn3Sm23__SVHPM100_v34__rjrskim.root
  - name: Z+jets
    files:
      - ZJetsToNuNu_HT-*_RunIISummer20UL18__SVIPM100_v34__rjrskim.root
      - Zto2Nu-4Jets_HT-*_Run3Summer23__SVIPM100_v34__rjrskim.root
  # Run 2 only: no Run 3 sample (not enough statistics to justify it)
  - name: t#bar{t}+jets
    files:
      - TTJets_RunIISummer20UL18__SVIPM100_v34__rjrskim.root
  # HT-binned only: GJ-4Jets-2NLO2LO_PTG-120_Bias_* overlaps these and is left out
  - name: "#gamma+jets"
    files:
      - GJets_HT-*_RunIISummer20UL18__SVHPM100_v2_v34__rjrskim.root
      - GJ-4Jets_HT-*_Run3Summer23__SVHPM100_v34__rjrskim.root

# Full Run 2 + Run 3, 2016-2026 (2026 = Run2026B + D, the certified eras)
data:
  - name: Run 2+3
    combine: true
    files:
      - MET_Run201[678]*__llpCombineSkim.root
      - JetMET_Run2022*__llpCombineSkim.root
      - PixSeedFix_JetMET[01]_Run2023*__llpCombineSkim.root
      - JetMET[01]_Run2024*__llpCombineSkim.root
      - JetMET[01]_Run2025*__llpCombineSkim.root
      - kucmsntuple_JetMET_R25_*__llpCombineSkim.root
      - JetMET[01]_Run2026*__llpCombineSkim.root
